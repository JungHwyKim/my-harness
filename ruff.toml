# 이 저장소가 채택한 Ruff 규칙. Full Quality Profile의 lint·format 단계가 이것을 쓴다.
#
# **선택 규칙을 적어 두는 것이 요점이다.** 설정이 없으면 Ruff는 자기 기본값을 쓰는데,
# 그 기본값은 버전마다 달라진다. 실측(2026-11-18, Ruff 0.17.5): 설정 없이 돌리면
# `PLW1510`·`I001`·`FURB167`·`RUF100` 11건이 나오고, 문서에 적힌 기본 선택
# (`E4`·`E7`·`E9`·`F`)만 주면 0건이다. 저장소가 그 11건의 규칙을 고른 적이 없으므로,
# 고른 것을 여기 적어 버전이 올라가도 기준이 저절로 바뀌지 않게 한다.
#
# 규칙을 더 넣는 것은 따로 정할 일이다. `I`(import 정렬)와 `RUF100`(죽은 noqa)은
# 자동 수정 4건으로 끝나므로 값이 싸다.
line-length = 100

[lint]
# Ruff 문서가 기본으로 적는 선택. 지금 저장소가 통과하는 범위이기도 하다
select = ["E4", "E7", "E9", "F"]

[format]
# line-length 를 88(Ruff 기본) 대신 100 으로 둔 이유:
#
# Ruff 포매터는 줄 너비를 **표시 폭**으로 센다. 한글은 한 글자가 두 칸이라, 글자 수로는
# 짧은 한국어 메시지 한 줄이 폭으로는 두 배가 된다. 이 저장소의 .py 33개에서 글자 수로
# 100을 넘는 줄은 9개뿐인데 표시 폭 최댓값은 113이다. 88로 두면 지은이가 한 줄로 쓴
# 한국어 예외 메시지가 전부 괄호 줄바꿈으로 쪼개진다.
#
# **폭을 더 키우는 것은 답이 아니다**(실측). 110에서 18개, 120·130에서 20개, 140에서
# 21개 파일이 대상이 된다 — 폭이 넓어지면 포매터가 지은이가 일부러 쪼갠 줄을 거꾸로
# 합치려 든다. 100이 최소(16개)다. 그 16개는 한 번 포맷해 기준으로 삼았다
